  - id: onset_lt3d
    label_vi: "Dưới 3 ngày"
  - id: onset_3_14d
    label_vi: "Từ 3 đến 14 ngày"
  - id: onset_2_8w
    label_vi: "Từ 2 đến 8 tuần"
  - id: onset_gt2m
    label_vi: "Trên 2 tháng"
  - id: onset_sudden
    label_vi: "Xuất hiện đột ngột chỉ trong vài giờ"
